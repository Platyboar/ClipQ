line-length = 120
target-version = "py38"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # Long inline strings/URLs kept readable; checked separately
]

[lint.per-file-ignores]
"tests/*.py" = ["B011"]

[format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
